    function svgIcon(name){const paths={grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',play:'<path d="m9 5 10 7-10 7V5Z"/>',brain:'<path d="M9.5 4a3.5 3.5 0 0 0-3 5.3A3.5 3.5 0 0 0 8 16a3.5 3.5 0 0 0 6 2.5A3.5 3.5 0 0 0 16 16a3.5 3.5 0 0 0 1.5-6.7A3.5 3.5 0 0 0 14.5 4a3.4 3.4 0 0 0-5 0Z"/><path d="M12 6v12M8 9h2M14 9h2M8 14h2M14 14h2"/>',bolt:'<path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z"/>',chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 3-4 3 2 5-7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M7 14h.01M11 14h.01M15 14h.01M7 18h.01M11 18h.01"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c.4-3.1 2.3-5 6-5s5.6 1.9 6 5M16 11a3 3 0 1 0 0-6M16 15c2.8 0 4.5 1.6 5 4"/>',camera:'<path d="M4 8h4l2-2h4l2 2h4v11H4Z"/><circle cx="12" cy="13" r="3"/>',edit:'<path d="m4 16-.8 4.8L8 20l11-11-4-4L4 16Z"/><path d="m13 6 4 4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1A1.7 1.7 0 0 0 8.4 15a1.7 1.7 0 0 0-1.5-1H6v-2.4h.9a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6 9.7 7l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0-1.5 1h.2v2.4h-.2a1.7 1.7 0 0 0-1.5 1Z"/>',logout:'<path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/>',moon:'<path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.2 2.5 3.2 5.5 3.2 9s-1 6.5-3.2 9c-2.2-2.5-3.2-5.5-3.2-9S9.8 5.5 12 3Z"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};return `<svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.grid}</svg>`}

    function profileMenu(){if(!state.profileOpen)return"";const en=state.lang==="en";return `<div class="profile-menu"><div class="profile-card">${avatarMarkup()}<div><b>${displayName()}</b><small>${roleLabel()}</small><span class="profile-status"><i></i>${en?"Active now":"متصل الآن"}</span></div></div><button class="profile-action" onclick="openProfileEditor()">${svgIcon("edit")}<span>${en?"Edit profile":"تعديل الملف الشخصي"}</span></button><button class="profile-action" onclick="openPermissions()">${svgIcon("lock")}<span>${en?"My permissions":"صلاحياتي ومساحتي"}</span></button><button class="profile-action" onclick="toggleLang()">${svgIcon("globe")}<span>${en?"Switch to Arabic":"التبديل إلى English"}</span><span style="margin-inline-start:auto;color:var(--muted);font-size:9px">${en?"عربي":"EN"}</span></button><button class="profile-action" onclick="toggleDark()">${svgIcon("moon")}<span>${en?"Appearance":"المظهر"}</span><span style="margin-inline-start:auto;color:var(--muted);font-size:9px">${state.dark?(en?"Dark":"ليلي"):(en?"Light":"نهاري")}</span></button><div class="profile-sep"></div><button class="profile-action danger-action" onclick="signOut()">${svgIcon("logout")}<span>${en?"Sign out":"تسجيل الخروج"}</span></button></div>`}

    function replaceEmojiWithSvg(){
      const keys=Object.keys(svgIcons).sort((a,b)=>b.length-a.length),pattern=new RegExp(keys.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"gu");
      const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),nodes=[];
      while(walker.nextNode())nodes.push(walker.currentNode);
      nodes.forEach(node=>{
        if(node.parentElement.closest("script,style,.svg-glyph"))return;
        if(!pattern.test(node.nodeValue)){pattern.lastIndex=0;return}
        pattern.lastIndex=0;
        const fragment=document.createDocumentFragment();let last=0,match;
        while((match=pattern.exec(node.nodeValue))){
          if(match.index>last)fragment.appendChild(document.createTextNode(node.nodeValue.slice(last,match.index)));
          const icon=document.createElement("span");icon.className="svg-glyph";icon.innerHTML=svgIcons[match[0]];fragment.appendChild(icon);last=match.index+match[0].length;
        }
        if(last<node.nodeValue.length)fragment.appendChild(document.createTextNode(node.nodeValue.slice(last)));
        node.parentNode.replaceChild(fragment,node);
      });
    }

    document.head.appendChild(svgIconStyle);
    const svgIconObserver=new MutationObserver(()=>replaceEmojiWithSvg());
    svgIconObserver.observe(document.body,{childList:true,subtree:true});
